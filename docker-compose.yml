version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: decision_db
    environment:
      POSTGRES_DB: bi_ventes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1111
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d/

  app:
    build: .
    container_name: decision_dashboard
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=bi_ventes_db
      - DB_USER=postgres
      - DB_PASSWORD=1111
    depends_on:
      - db

volumes:
  postgres_data:
